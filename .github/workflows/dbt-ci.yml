name: dbt CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install "dbt-core==1.12.6" "dbt-duckdb==1.11.0"

      - name: Build and test (seeds, models, tests) on DuckDB
        run: dbt build --profiles-dir ci --target ci

      - name: Run again to exercise the incremental model
        run: dbt build --profiles-dir ci --target ci --select fct_gl_entries+
