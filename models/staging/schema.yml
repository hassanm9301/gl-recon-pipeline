version: 2

models:
  - name: stg_gl_entries
    description: "Synthetic double-entry GL lines that tie to Baker Hughes reported quarterly results (2023-Q1 to 2026-Q3), with planted breaks"
    columns:
      - name: gl_line_id
        description: "Unique identifier for each GL line (journal entry + line number)"
        data_tests:
          - unique
          - not_null
      - name: journal_entry_id
        description: "Journal entry identifier (each entry has a debit line and a credit line)"
        data_tests:
          - not_null
      - name: entry_date
        description: "Date of journal entry"
        data_tests:
          - not_null
      - name: segment
        description: "Business segment"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OFSE', 'IET', 'Chart', 'Corporate']
      - name: account_code
        description: "GL account code"
        data_tests:
          - not_null

  - name: stg_chart_of_accounts
    description: "Chart of accounts reference data"
    columns:
      - name: account_code
        description: "Unique account code"
        data_tests:
          - unique
          - not_null