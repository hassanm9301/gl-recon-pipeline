version: 2

models:
  - name: stg_gl_entries
    description: "Cleaned and typed synthetic GL journal entries modeled on Baker Hughes' FY2023 10-K"
    columns:
      - name: journal_entry_id
        description: "Unique identifier for each journal entry"
        data_tests:
          - unique
          - not_null
      - name: entry_date
        description: "Date of journal entry"
        data_tests:
          - not_null
      - name: segment
        description: "Business segment"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OFSE', 'IET', 'Corporate']
      - name: account_code
        description: "GL account code"
        data_tests:
          - not_null

  - name: stg_chart_of_accounts
    description: "Chart of accounts reference data"
    columns:
      - name: account_code
        description: "Unique account code"
        data_tests:
          - unique
          - not_null